<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<!-- CSP: openligaDB (Live-Daten) erlaubt -->
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src * data: blob:; script-src 'self' 'unsafe-inline'; connect-src https://www.openligadb.de;">
<meta name="theme-color" content="#1f5caf">
<meta name="description" content="KSC – Fan Dashboard: 2. Bundesliga, Kader, News, Live-Ergebnisse. PWA, offline-fähig.">
<meta name="author" content="Daniel Lienhard">
<meta name="application-name" content="hAI.WMPlan">
<meta name="keywords" content="KSC, Karlsruher SC, 2. Bundesliga, Fan Dashboard, Kader, News">
<!-- Open Graph -->
<meta property="og:title" content="KSC – Fan Dashboard">
<meta property="og:description" content="KSC-Dashboard: 2. Bundesliga, Kader, News, Live-Ergebnisse – PWA.">
<meta property="og:type" content="website">
<meta property="og:locale" content="de_DE">
<meta name="twitter:card" content="summary">
<title>KSC – Fan Dashboard</title>
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<!-- Theme-FOUC verhindern -->
<script>
  (function(){
    const t = localStorage.getItem('ksc_theme') || 'ksc';
    document.documentElement.dataset.theme = t;
    document.body && (document.body.dataset.theme = t);
  })();
</script>
</head>
<body>

<!-- PWA Install-Banner -->
<div id="installBanner" aria-live="polite">
  <span>📲 App installieren – auch offline nutzbar</span>
  <button id="installBtn">Installieren</button>
  <button class="close-banner" id="closeBanner" aria-label="Banner schließen">✕</button>
</div>

<header>
  <img src="logo.png" alt="KSC Logo" class="logo">
  <h1>KSC – Dashboard</h1>
  <span class="badge">2. Bundesliga · Amateure · Frauen</span>
  <div class="live-badge" id="liveBadge" title="Live-Daten werden automatisch abgerufen">
    <span class="live-dot"></span> LIVE
  </div>
  <button class="btn-theme" id="themeBtn" aria-label="Theme wechseln">🔵</button>
</header>

<nav class="tabs" role="tablist" aria-label="Dashboard">
  <button class="tab active" data-tab="overview" role="tab" aria-selected="true">Übersicht</button>
  <button class="tab" data-tab="matches" role="tab" aria-selected="false">Spieltage</button>
  <button class="tab" data-tab="squad" role="tab" aria-selected="false">Kader</button>
  <button class="tab" data-tab="news" role="tab" aria-selected="false">News</button>
</nav>

<main id="app" role="main"></main>
<div class="api-status" id="apiStatus" aria-live="polite"></div>

<script type="module" src="app.js"></script>
</body>
</html>
